<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    /* The palette in globals.css is pure neutral, so the mark is too. The
       media query is what keeps it visible on a dark browser tab; without it a
       near-black mark disappears into the chrome. */
    .mark { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) { .mark { fill: #fafafa; } }
  </style>
